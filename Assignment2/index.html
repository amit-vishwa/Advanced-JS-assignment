<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Advanced JavaScript Assignment 2</title>

<body>

        <section>
            <h3>Question 1</h3>
            <div class='m-5'>
                Check the console for output
                <br/>
                <button class='btn btn-primary' type="button" onclick="handleSubmitQ1()">Call API</button>

        </section>
        <section>
            <h3>Question 2</h3>
            <div class='m-5'>
                <form>
                    <label>add Queen 1 coordinates</label>
                    <div class='input-group'>
                        <input class='form-control' type='number' value=0 id='q-1-x' min=0 max=7 placeholder="x-coordinate">
                        <input class='form-control' type='number' value=0 id='q-1-y' min=0 max=7 placeholder="y-coordinate">
                    </div>
                    <label>add Queen 2 coordinates</label>
                    <div class='input-group'>
                        <input class='form-control' type='number' value=0 id='q-2-x' min=0 max=7 placeholder="x-coordinate">
                        <input class='form-control' type='number' value=0 id='q-2-y' min=0 max=7 placeholder="y-coordinate">
                    </div>
                    <br />
                    <button class='btn btn-primary' type="button" onclick="handleSubmitQ2()">Submit</button>
                </form>
                <br /><br />
                <div id='attack-result'></div>
            </div>
        </section>
    </div>
