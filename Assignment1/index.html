<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Advanced JavaScript Assignment 1</title>

    <script src="Question1.js" defer></script>

<body>
    <div class='container'>
        <section>
            <h3>Question 1</h3>
            <div class='m-5'>
                <button class='btn btn-primary' type="button" onclick="handleSubmitQ1()">Aggregate</button>
                <br /><br />
                <p>Check Console for answer after clicking the above button</p>
                <div id='agg-data'></div>
            </div>
        </section>
        <section>
            <h3>Question 2</h3>
            <div class='m-5'>
                <div class='h4'>Construct a query</div>
                <form style='width:500px'>
                    <label>Enter owner name</label>
                    <input class='form-control' type='input' name='owner' id='owner' placeholder="luke-skywalker" />
                    <br />
                    <label>Enter repo name</label>
                    <input class='form-control' type='input' name='repository' id='repo' placeholder="force-wrapper" />
                    <br /><br />
                </form>
                <button class='btn btn-primary' type="button" onclick="handleSubmitQ2()">Search</button>
                <br /><br />
                <div>
                    <ul class='list-group' id='repo-list'>
                    </ul>
                </div>
            </div>
        </section>
        <section>
            <h3>Question 3</h3>
            <div class='m-5'>
                <button class='btn btn-primary' type="button" onclick="handleSubmitQ3()">Find</button>
                <br /><br />
                <ul class='list-group' id='nobel-list' style="height: 500px;overflow-y: scroll;">
                </ul>
            </div>
        </section>
        <section>
            <h3>Question 4</h3>
            <div class='m-5'>
                <button class='btn btn-primary' type="button" onclick="handleSubmitQ4()">Find</button>
                <br /><br />
                <ul class='list-group' id='flight-list' style="height: 500px;overflow-y: scroll;">
                </ul>
            </div>
        </section>
    </div>
</body>
